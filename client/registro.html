<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
</head>
<body>
    <main>
        <header>
            <h1>
                REGISTRO
            </h1>
        </header>
        <form id="registerForm">
            <div id="div-nombre">
                <div>
                    <label class="label-inputs" for="nombre">Nombre:</label>
                    <input class="text-input-name" type="text" id="nombre" name="nombre" placeholder="Nombre" required>
                </div>
                 <div>
                     <label class="label-inputs" for="apellido">Apellido:</label>
                     <input class="text-input-name" type="text" id="apellido" name="apellido" placeholder="Apellido" required>
                </div>   
            </div>
            <label class="label-inputs" for="email">Correo electrónico:</label>
            <input class="text-input" type="email" id="email" name="email" placeholder="tu@email.com" required>
            
            <label class="label-inputs" for="password">Password:</label>
            <div class="password-wrapper">
                <input class="text-input" type="password" id="password" name="password" placeholder="password" required>
                <button class="button-password" type="button" id="togglePassword" aria-label="Mostrar contraseña">👁️</button>
            </div>
            <div class="password-wrapper">
                <input class="text-input" type="password" id="password-confirm" name="password" placeholder="Confirmar password" required>
                <button class="button-password" type="button" id="togglePasswordConfirm" aria-label="Mostrar contraseña">👁️</button>
            </div>
            
            <button type="submit" id="registerBtn">Registrarse</button>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script type="module" src="./js/registro.js"></script>
</body>
</html>
